<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MUDBench Live</title>
  <style>
    :root {
      --bg: #080b0f;
      --panel: #0d1219;
      --panel-2: #111823;
      --line: #1e2a38;
      --text: #e6edf5;
      --muted: #9aa8b8;
      --faint: #7d8b9c;
      --accent: #5eead4;
      --accent-2: #7dd3fc;
      --warn: #fbbf24;
      --danger: #fb7185;
      --font-ui: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      --log-size: 16px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.5 var(--font-ui);
      display: flex;
      flex-direction: column;
    }
    header {
      min-height: 52px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 16px;
      border-bottom: 1px solid var(--line);
      background: var(--bg);
      flex-wrap: nowrap;
    }
    header strong { letter-spacing: .12em; font-size: 12px; text-transform: uppercase; }
    .brand { color: var(--accent); }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); display: inline-block; flex: 0 0 auto; }
    .dot.live { background: var(--danger); box-shadow: 0 0 0 3px rgba(251, 113, 133, 0.14); animation: pulse 2s infinite; }
    @keyframes pulse { 50% { opacity: 0.45; } }
    .spacer { flex: 1; }
    .muted { color: var(--muted); }
    .small { font-size: 12px; }
    a { color: var(--accent-2); text-decoration: none; }
    a:hover { text-decoration: underline; }
    main {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
    }
    #feed {
      overflow: auto;
      padding: 18px 24px 60px;
      font: var(--log-size)/1.65 var(--font-mono);
      scroll-behavior: smooth;
    }
    .line { white-space: pre-wrap; overflow-wrap: anywhere; }
    .line.room { color: var(--accent); margin-top: 14px; font-weight: 600; }
    .line.desc { color: var(--text); }
    .line.item { color: var(--muted); }
    .line.exits { color: var(--accent-2); }
    .line.cmd { color: var(--warn); margin-top: 10px; }
    .line.status { color: var(--muted); font-style: italic; margin: 10px 0; }
    .line.note { color: var(--muted); margin-top: 16px; }
    #side {
      border-left: 1px solid var(--line);
      background: var(--panel);
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    #side h2 { margin: 0; padding: 12px 14px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); }
    #chat { flex: 1; overflow: auto; padding: 10px 14px; }
    .msg { margin: 0 0 9px; }
    .msg { font-size: 13px; line-height: 1.5; }
    .msg .who { color: var(--accent-2); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
    .msg.mine .who { color: var(--accent); }
    .msg .body { overflow-wrap: anywhere; }
    #poll { padding: 10px 14px; border-bottom: 1px solid var(--line); }
    #poll h3 { margin: 0 0 6px; font-size: 13px; color: var(--accent-2); }
    #poll .option { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
    #poll button { flex: 1; text-align: left; background: var(--panel-2); color: var(--text); border: 1px solid var(--line); }
    #poll button:disabled { opacity: 0.65; }
    #poll .count { color: var(--muted); font-size: 12px; min-width: 24px; text-align: right; }
    .highlight-card { border-left: 3px solid var(--warn); background: #17140c; padding: 8px 10px; margin: 10px 0; }
    .highlight-card .meta { color: var(--muted); font-size: 11px; display: flex; justify-content: space-between; gap: 8px; }
    .highlight-card .body { margin-top: 4px; white-space: pre-wrap; }
    .highlight-card button { margin-top: 6px; padding: 4px 8px; font-size: 11px; background: transparent; color: var(--warn); border: 1px solid var(--line); }
    .last-card { margin: 18px auto 0; max-width: 720px; padding: 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
    .last-card h2 { margin: 0 0 4px; color: var(--accent); font-size: 16px; }
    .last-card .last-meta { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
    .last-card ul { margin: 0 0 10px; padding-left: 18px; color: var(--text); font-size: 12px; line-height: 1.5; }
    .last-card button { background: transparent; color: var(--accent); border: 1px solid var(--line); padding: 5px 9px; font-size: 11px; }
    #chat-form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); }
    #chat-input {
      flex: 1;
      min-width: 0;
      background: var(--panel-2);
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 6px;
      padding: 9px 10px;
      font: inherit;
    }
    #chat-input:disabled { opacity: 0.55; }
    button {
      background: var(--accent);
      color: #062018;
      border: 0;
      border-radius: 6px;
      padding: 9px 13px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: default; }
    #offline {
      margin: 40px auto;
      max-width: 620px;
      padding: 26px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      text-align: center;
    }
    #offline h1 { margin: 0 0 8px; font-size: 18px; }
    #offline p { color: var(--muted); }
    @media (max-width: 820px) {
      header { min-height: 52px; padding: 8px 12px; gap: 7px; flex-wrap: wrap; }
      header .small { font-size: 11px; }
      main { grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) 42vh; }
      #side { border-left: 0; border-top: 1px solid var(--line); }
      #feed { padding: 14px 16px 40px; font-size: 15px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .dot.live { animation: none; }
      #feed { scroll-behavior: auto; }
    }
  </style>
</head>
<body>
  <header>
    <span class="dot" id="dot"></span>
    <strong class="brand">MUDBench <span class="muted">LIVE</span></strong>
    <span id="character" class="muted">no run</span>
    <span id="room" class="muted"></span>
    <span id="tick" class="muted small"></span>
    <span class="spacer"></span>
    <span id="viewers" class="muted small">0 watching</span>
    <a href="/" class="small">Play / start a run →</a>
  </header>
  <main>
    <div id="feed">
      <div id="offline">
        <h1>No AI is live right now</h1>
        <p>Open the game, start <strong>Watch AI</strong>, then press <strong>Go live</strong> in the run panel.</p>
        <p class="small">The stream is opt-in. The AI's private thoughts, tells and mail are never published.</p>
        <p><a href="/">Open MUDBench →</a></p>
      </div>
    </div>
    <aside id="side">
      <h2>Audience chat</h2>
      <div id="poll" hidden></div>
      <div id="chat" aria-live="polite"></div>
      <form id="chat-form">
        <input id="chat-input" autocomplete="off" maxlength="240" placeholder="No run is live" disabled aria-label="Audience message">
        <button type="submit" disabled>Send</button>
      </form>
    </aside>
  </main>
  <script type="module">
    const dot = document.getElementById("dot");
    const character = document.getElementById("character");
    const room = document.getElementById("room");
    const tick = document.getElementById("tick");
    const viewers = document.getElementById("viewers");
    const feed = document.getElementById("feed");
    const chat = document.getElementById("chat");
    const pollBox = document.getElementById("poll");
    const form = document.getElementById("chat-form");
    const input = document.getElementById("chat-input");
    const send = form.querySelector("button");

    let socket = null;
    let retry = 0;
    let live = null;
    let myId = null;
    let myVote = null;
    let stick = true;

    feed.addEventListener("scroll", () => {
      stick = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 60;
    });

    function showOffline() {
      feed.replaceChildren();
      const box = document.createElement("div");
      box.id = "offline";
      box.innerHTML = "<h1>No AI is live right now</h1><p>Open the game, start <strong>Watch AI</strong>, then press <strong>Go live</strong> in the run panel.</p><p class=\"small\">The stream is opt-in. The AI's private thoughts, tells and mail are never published.</p><p><a href=\"/\">Open MUDBench →</a></p>";
      feed.appendChild(box);
    }

    function renderLast(last) {
      if (!last || !feed.querySelector("#offline")) return;
      const box = document.createElement("div");
      box.className = "last-card";
      const title = document.createElement("h2");
      title.textContent = `Last run: ${last.name ?? "AI"}`;
      const meta = document.createElement("div");
      meta.className = "last-meta";
      const ended = last.endedAt ? new Date(last.endedAt).toLocaleString() : "ended";
      meta.textContent = `${last.room ?? "unknown room"} · ${ended} · peak ${last.peakViewers ?? 0} watching · ${last.highlights?.length ?? 0} highlights`;
      box.append(title, meta);
      if (last.highlights?.length) {
        const list = document.createElement("ul");
        for (const item of last.highlights.slice(0, 4)) {
          const entry = document.createElement("li");
          entry.textContent = `turn ${item.turn ?? "—"}: ${String(item.text ?? "").slice(0, 180)}`;
          list.appendChild(entry);
        }
        box.appendChild(list);
      }
      const download = document.createElement("button");
      download.type = "button";
      download.textContent = "Download last run";
      download.addEventListener("click", () => {
        const blob = new Blob([JSON.stringify({ kind: "mudbenchmark/last-run/1", ...last }, null, 2)], { type: "application/json" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `mudbench-last-run-${Date.now()}.json`;
        link.click();
        setTimeout(() => URL.revokeObjectURL(link.href), 1000);
      });
      box.appendChild(download);
      feed.appendChild(box);
    }

    async function loadLast() {
      try {
        const res = await fetch("/stream", { signal: AbortSignal.timeout(3000) });
        if (!res.ok) return;
        const data = await res.json();
        if (data.last) renderLast(data.last);
      } catch {}
    }

    function line(text, cls = "desc") {
      const node = document.createElement("div");
      node.className = `line ${cls}`;
      node.textContent = text;
      feed.appendChild(node);
      if (stick) requestAnimationFrame(() => { feed.scrollTop = feed.scrollHeight; });
    }

    function chatLine(from, text, mine = false) {
      const wrap = document.createElement("div");
      wrap.className = `msg${mine ? " mine" : ""}`;
      const who = document.createElement("div");
      who.className = "who";
      who.textContent = from;
      const body = document.createElement("div");
      body.className = "body";
      body.textContent = text;
      wrap.append(who, body);
      chat.appendChild(wrap);
      chat.scrollTop = chat.scrollHeight;
    }

    function renderPoll(poll, result = null) {
      if (!poll && !result) { pollBox.hidden = true; pollBox.replaceChildren(); myVote = null; return; }
      pollBox.hidden = false;
      pollBox.replaceChildren();
      const title = document.createElement("h3");
      title.textContent = result ? `Poll closed: ${result.question}` : poll.question;
      pollBox.appendChild(title);
      for (const key of ["a", "b"]) {
        const option = document.createElement("div");
        option.className = "option";
        const button = document.createElement("button");
        const label = result ? result.options[key] : poll.options[key];
        const count = result ? result.votes[key] : poll.votes[key];
        button.textContent = `${key.toUpperCase()} · ${label}`;
        button.disabled = Boolean(result) || myVote !== null;
        button.addEventListener("click", () => {
          if (!live || myVote || socket?.readyState !== WebSocket.OPEN) return;
          socket.send(`vote ${key}\n`);
          myVote = key;
          renderPoll(poll);
        });
        const countNode = document.createElement("span");
        countNode.className = "count";
        countNode.textContent = String(count);
        option.append(button, countNode);
        pollBox.appendChild(option);
      }
      if (myVote && !result) {
        const note = document.createElement("div");
        note.className = "muted small";
        note.textContent = `You voted ${myVote.toUpperCase()}.`;
        pollBox.appendChild(note);
      }
    }

    function setLive(next) {
      live = next;
      dot.classList.toggle("live", Boolean(next));
      character.textContent = next ? next.name : "no run";
      room.textContent = next?.room ? `· ${next.room}` : "";
      tick.textContent = next?.tick != null ? `tick ${next.tick}` : "";
      const chatOn = next ? next.chat !== false : false;
      input.disabled = !next || !chatOn;
      send.disabled = !next || !chatOn;
      input.placeholder = !next ? "No run is live" : chatOn ? "Say something to the run…" : "Audience chat is off";
      document.title = next ? `${next.name} — MUDBench Live` : "MUDBench Live";
      if (!next) { renderPoll(null); myVote = null; return; }
      document.getElementById("offline")?.remove();
      if (next.poll) renderPoll(next.poll);
      for (const event of next.events ?? []) renderEvent(event, false);
    }

    function renderEvent(event, scroll = true) {
      if (!event) return;
      if (event.kind === "command") line(`> ${event.text}`, "cmd");
      else if (event.kind === "room") line(`[${event.text}]`, "room");
      else if (event.kind === "status") line(event.text, "status");
      else if (event.kind === "highlight") {
        const card = document.createElement("div");
        card.className = "highlight-card";
        const meta = document.createElement("div");
        meta.className = "meta";
        const left = document.createElement("span");
        left.textContent = `★ turn ${event.turn ?? "—"} · tick ${event.tick ?? "—"}`;
        const right = document.createElement("span");
        right.textContent = event.at ? new Date(event.at).toLocaleTimeString() : "";
        meta.append(left, right);
        const body = document.createElement("div");
        body.className = "body";
        body.textContent = event.text;
        const copy = document.createElement("button");
        copy.type = "button";
        copy.textContent = "Copy clip";
        copy.addEventListener("click", async () => {
          const clip = JSON.stringify({ kind: "mudbenchmark/clip/1", live: live?.name ?? null, ...event }, null, 2);
          try { await navigator.clipboard.writeText(clip); copy.textContent = "Copied"; }
          catch { copy.textContent = "Copy failed"; }
        });
        const download = document.createElement("button");
        download.type = "button";
        download.textContent = "Download clip";
        download.addEventListener("click", () => {
          const clip = JSON.stringify({ kind: "mudbenchmark/clip/1", live: live?.name ?? null, ...event }, null, 2);
          const blob = new Blob([clip], { type: "application/json" });
          const link = document.createElement("a");
          link.href = URL.createObjectURL(blob);
          link.download = `mudbench-clip-${event.turn ?? Date.now()}.json`;
          link.click();
          setTimeout(() => URL.revokeObjectURL(link.href), 1000);
        });
        card.append(meta, body, copy, download);
        feed.appendChild(card);
      } else {
        for (const part of String(event.text).split("\n")) {
          if (!part.trim()) { line("", "desc"); continue; }
          if (/^\[.*\]$/.test(part.trim())) line(part, "room");
          else if (/^(Here|Objects):$/i.test(part.trim())) line(part, "item");
          else if (/^  /.test(part)) line(part, "item");
          else if (/^Exits:/i.test(part.trim())) line(part, "exits");
          else line(part, "desc");
        }
      }
      if (scroll && stick) requestAnimationFrame(() => { feed.scrollTop = feed.scrollHeight; });
    }

    function handle(payload) {
      if (payload.type === "snapshot") {
        myId = payload.viewer ?? null;
        if (payload.live) {
          feed.replaceChildren();
          setLive(payload.live);
          line("The run is live. Audience messages reach the AI as director input.", "note");
        } else {
          setLive(null);
          showOffline();
          loadLast();
        }
        viewers.textContent = `${payload.viewers ?? 0} watching`;
        return;
      }
      if (payload.type === "live") {
        feed.replaceChildren();
        setLive(payload.live);
        line("The run is live. Audience messages reach the AI as director input.", "note");
        return;
      }
      if (payload.type === "off") {
        setLive(null);
        showOffline();
        if (payload.last) renderLast(payload.last);
        else loadLast();
        line("The run ended.", "status");
        return;
      }
      if (payload.type === "event") {
        setLive({ ...(live ?? {}), name: payload.name, room: payload.room, tick: payload.tick, status: payload.status });
        renderEvent(payload.event);
        return;
      }
      if (payload.type === "poll") {
        if (live) live.poll = payload.poll;
        renderPoll(payload.poll, payload.result ?? null);
        return;
      }
      if (payload.type === "chat-state") {
        if (live) live.chat = payload.chat;
        const chatOn = payload.chat !== false;
        input.disabled = !live || !chatOn;
        send.disabled = !live || !chatOn;
        input.placeholder = chatOn ? "Say something to the run…" : "Audience chat is off";
        return;
      }
      if (payload.type === "chat") {
        if (payload.from !== myId) chatLine(payload.from, payload.text);
        return;
      }
      if (payload.type === "viewers") {
        viewers.textContent = `${payload.viewers ?? 0} watching`;
        return;
      }
      if (payload.type === "error") {
        chatLine("system", payload.why ?? "error");
      }
    }

    function connect() {
      const scheme = location.protocol === "https:" ? "wss:" : "ws:";
      socket = new WebSocket(`${scheme}//${location.host}/live`);
      socket.onopen = () => { retry = 0; };
      socket.onmessage = (event) => {
        const text = String(event.data);
        const match = text.match(/^#stream (.*)\n?$/);
        if (!match) return;
        try { handle(JSON.parse(match[1])); } catch {}
      };
      socket.onclose = () => {
        retry += 1;
        setTimeout(connect, Math.min(5000, 400 * retry));
      };
      socket.onerror = () => {};
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text || !live || socket?.readyState !== WebSocket.OPEN) return;
      socket.send(`chat ${text}\n`);
      chatLine("you", text, true);
      input.value = "";
    });

    connect();
  </script>
</body>
</html>
