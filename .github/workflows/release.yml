name: Release a gated commit

# X6: one action releases a commit that the Gate has already proved.
#
# The workflow does not build anything. It finds the successful Gate run for the
# exact commit, downloads that run's artifact (the holo, manifest and identity
# receipt), creates the tag, and publishes the release. A missing or red Gate
# run stops before the tag exists, so a red commit cannot become a release.
#
# Tag pushes made with GITHUB_TOKEN do not trigger workflows, so this does not
# run Gate a second time. The deploy timer on wick pulls the newest release.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA with a successful Gate run"
        required: true
        type: string
      tag:
        description: "Release tag, vX.Y.Z"
        required: true
        type: string
      notes:
        description: "Extra release notes"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: publish the gated artifact
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - name: Check the checkout is the requested commit
        env:
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SHA" || {
            echo "::error::checkout is $(git rev-parse HEAD), not $SHA"
            exit 1
          }

      - name: Require a green Gate on this exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          # The latest run on the SHA must be green, not merely an earlier one.
          # A re-run that went red is a red gate even if a previous attempt passed.
          RUN_ID=$(gh run list --workflow gate.yml --commit "$SHA" --limit 1 --json databaseId,conclusion --jq '.[0] | select(.conclusion == "success") | .databaseId')
          if [ -z "$RUN_ID" ]; then
            echo "::error::The latest Gate run for $SHA is not green (or there is none). Fix it, then release."
            exit 1
          fi
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          gh run view "$RUN_ID" --json url --jq '"RUN_URL=" + .url' >> "$GITHUB_ENV"
          echo "gate run $RUN_ID is green for $SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Download the artifact the Gate proved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" -n mudbench-holo -D artifact
          find artifact -maxdepth 2 -type f -print

      - name: Create the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::tag must look like vX.Y.Z"; exit 1 ;;
          esac
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "::error::tag $TAG already exists"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$SHA" -m "Released from $SHA by the Gate run $RUN_ID"
          git push origin "$TAG"

      - name: Package the runtime
        run: tar --exclude=node_modules -czf runtime.tar.gz runtime world/data

      - name: Write the release manifest
        env:
          TAG: ${{ inputs.tag }}
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          HOLO=$(find artifact -name 'MUDBench.holo' | head -1)
          test -n "$HOLO"
          python3 deploy/release-manifest.py --tag "$TAG" --commit "$SHA" --gate-run "$RUN_ID" --holo "$HOLO" --runtime runtime.tar.gz --out release-manifest.json

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          HOLO=$(find artifact -name 'MUDBench.holo' | head -1)
          MANIFEST=$(find artifact -name 'manifest.json' | head -1)
          RECEIPT=$(find artifact -name 'identity-receipt.json' | head -1)
          ADMISSION=$(find artifact -name 'admission-receipt.json' | head -1)
          test -n "$HOLO"
          test -n "$MANIFEST"
          test -n "$RECEIPT"
          test -n "$ADMISSION"
          KERNEL=$(sed -n 's/.*"kernel": "\(sha256:[0-9a-f]*\)".*/\1/p' "$RECEIPT")
          AKERNEL=$(sed -n 's/.*"kernel": "\(sha256:[0-9a-f]*\)".*/\1/p' "$ADMISSION")
          gh release create "$TAG" "$HOLO" "$MANIFEST" "$RECEIPT" "$ADMISSION" runtime.tar.gz release-manifest.json \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes "Released from ${{ inputs.sha }} by the Gate run $RUN_URL. Identity kernel $KERNEL; every kind-7 verdict is in identity-receipt.json. Admission kernel $AKERNEL; every admission verdict is in admission-receipt.json.${NOTES:+ $NOTES}" \
            --verify-tag
          echo "released $TAG from ${{ inputs.sha }} (Gate $RUN_ID)" >> "$GITHUB_STEP_SUMMARY"
