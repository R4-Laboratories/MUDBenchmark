# The self-improvement tick, in the lexlean-r4 pattern: one job, the project's
# own gate, a direct commit to main, and a dispatched release. It uses only
# `secrets.GITHUB_TOKEN`; there is no App and no second credential.
#
# The tick is valid only on the tip of main. It builds one seeded inventory,
# measures it on the hidden playthroughs, and commits the admitted pacing file
# if one dominates. A settled inventory commits nothing. The gate runs in this
# job with the file applied, and the tag's Gate run proves it again with the
# model before a release is published.
#
# Enable: set the repository variable MUDBENCH_LOOP to `on`.
# Pause: set it to `off` (or delete it). The default is off.
#
# The publisher admits and gates before the direct push. The push triggers Gate
# on the commit; release.yml requires that latest green run, downloads its
# artifact, creates the tag and publishes. A red candidate is refused before the
# push. docs/SELF-IMPROVEMENT.md records the branch decision.

name: Loop

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run checks without a commit; commit pushes the admitted pacing file"
        type: choice
        options: [dry-run, commit]
        default: dry-run
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: loop
  cancel-in-progress: false

jobs:
  tick:
    name: one tick of the loop
    if: vars.MUDBENCH_LOOP == 'on'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Is this the tip of main
        id: tip
        shell: bash
        run: |
          set -euo pipefail
          remote=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          local=$(git rev-parse HEAD)
          if [ "$remote" = "$local" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main moved; this tick is stale and will not measure"
          fi

      - name: Build and measure one inventory
        if: steps.tip.outputs.current == 'true'
        env:
          SEED: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          node tools/candidate.mjs --seed "$SEED" --out /tmp/candidates.json
          node tools/measure.mjs --candidates /tmp/candidates.json --out /tmp/result.json

      - name: Publish
        id: publish
        if: steps.tip.outputs.current == 'true'
        run: |
          set -euo pipefail
          MODE="${{ inputs.mode }}"
          if [ -z "$MODE" ]; then MODE="commit"; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node tools/publish.mjs --candidates /tmp/candidates.json --result /tmp/result.json --"$MODE"

      - name: Release the tick through the gated X6 path
        if: steps.tip.outputs.current == 'true' && steps.publish.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.publish.outputs.sha }}
        run: |
          set -euo pipefail
          # The push triggered Gate on main. Wait for the latest run on this
          # exact SHA; release.yml requires the same green run and downloads its
          # artifact. A red or missing Gate cannot create the tag.
          for _ in $(seq 1 60); do
            row=$(gh run list --workflow gate.yml --commit "$SHA" --limit 1 --json databaseId,status,conclusion --jq '.[0] // empty | "\(.databaseId) \(.status) \(.conclusion)"')
            status=$(printf '%s' "$row" | awk '{print $2}')
            conclusion=$(printf '%s' "$row" | awk '{print $3}')
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" != "success" ]; then
                echo "::error::Gate on $SHA is $conclusion"
                exit 1
              fi
              break
            fi
            sleep 15
          done
          BASE=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          BASE=${BASE:-v0.0.0}
          TAG="${BASE}-loop.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          gh workflow run release.yml --ref main -f sha="$SHA" -f tag="$TAG" -f notes="Loop pacing tick $TAG."
          echo "::notice::dispatched $TAG through release.yml for $SHA" >> "$GITHUB_STEP_SUMMARY"
